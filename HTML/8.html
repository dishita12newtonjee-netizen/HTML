
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Survey Form</title>
</head>
<body>

    <h1>Student Survey Form</h1>

    <form>

        <h2>1. What is your favorite subject?</h2>

        <input type="radio" id="html" name="subject" value="HTML">
        <label for="html">HTML</label><br>

        <input type="radio" id="python" name="subject" value="Python">
        <label for="python">Python</label><br>

        <input type="radio" id="maths" name="subject" value="Mathematics">
        <label for="maths">Mathematics</label><br>

        <input type="radio" id="science" name="subject" value="Science">
        <label for="science">Science</label><br>

        <hr>

        <h2>2. What are your hobbies?</h2>

        <input type="checkbox" id="reading" name="hobbies" value="Reading">
        <label for="reading">Reading</label><br>

        <input type="checkbox" id="music" name="hobbies" value="Music">
        <label for="music">Listening to Music</label><br>

        <input type="checkbox" id="sports" name="hobbies" value="Sports">
        <label for="sports">Playing Sports</label><br>

        <input type="checkbox" id="coding" name="hobbies" value="Coding">
        <label for="coding">Coding</label><br>

        <input type="checkbox" id="travel" name="hobbies" value="Traveling">
        <label for="travel">Traveling</label><br>

        <hr>

        <button type="submit">Submit Survey</button>

    </form>

</body>
</html>
