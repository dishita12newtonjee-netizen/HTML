
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f9ff;
            margin: 20px;
        }

        h1 {
            color: #173b73;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .photo {
            width: 30%;
            min-width: 250px;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .photo img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .photo h3 {
            color: #173b73;
        }

        .photo p {
            font-style: italic;
            color: #555555;
        }

        hr {
            margin: 30px 0;
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>
    <p><i>Beautiful moments, captured forever!</i></p>

    <hr>

    <div class="gallery">

        <div class="photo">
            <img src="images/mountain.jpg"
                 alt="A beautiful mountain lake">
            <h3>Mountain Lake</h3>
            <p>A peaceful lake surrounded by mountains.</p>
        </div>

        <div class="photo">
            <img src="images/puppy.jpg"
                 alt="A golden retriever puppy in a garden">
            <h3>Golden Retriever</h3>
            <p>A happy puppy in the garden.</p>
        </div>

        <div class="photo">
            <img src="images/beach.jpg"
                 alt="A beautiful sunset over the ocean">
            <h3>Beach Sunset</h3>
            <p>The sun sets over the ocean.</p>
        </div>

    </div>

    <hr>

</body>
</html>
